name: Node.js Package

on:
  release:
    types: [created]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs Node.js from .node-version and pnpm from packageManager, then runs pnpm install
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - run: pnpm pull:google-proto
      - run: pnpm test
      - run: pnpm build
      # pnpm 11+ ignores env-var auth tokens in a tracked .npmrc, so the token goes to the user-level one
      - name: Set up npm auth for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          chmod 600 ~/.npmrc
        env:
          NPM_TOKEN: ${{ github.token }}
      # The release checkout is a detached HEAD, so skip the branch and clean-tree checks
      - run: pnpm publish --no-git-checks
